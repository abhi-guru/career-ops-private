# Portal Scanner Configuration
# Customized for: Abhi Guruprasad — Data Architect / Principal Data Engineer
# Target: Remote US roles, $150K+

title_filter:
  positive:
    # -- Data Architecture --
    - "Data Architect"
    - "Enterprise Architect"
    - "Cloud Architect"
    - "Solution Architect"
    - "Solutions Architect"
    - "Data Platform Architect"
    - "Analytics Architect"
    # -- Senior / Staff / Principal Data Engineering --
    - "Data Engineer"
    - "Staff Data"
    - "Principal Data"
    - "Senior Data"
    - "Lead Data"
    - "Data Platform"
    - "Data Infrastructure"
    - "Platform Engineer"
    # -- Cloud & Analytics --
    - "Analytics Engineer"
    - "BI Engineer"
    - "BI Architect"
    - "Databricks"
    - "Snowflake"
    - "Azure Data"
    - "AWS Data"
    # -- Governance & MDM --
    - "Data Governance"
    - "Master Data"
    - "MDM"
    - "Data Mesh"
    - "Data Lakehouse"
  negative:
    - "Junior"
    - "Associate"
    - "Intern"
    - "Entry Level"
    - "Data Scientist"
    - "Machine Learning"
    - "ML Engineer"
    - "AI Engineer"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Salesforce Admin"
    - "SAP "
    - "COBOL"
    - "Mainframe"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Game"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"
    - "Director"
    - "Architect"

# -- Search queries --

search_queries:

  # -- Ashby --
  - name: Ashby — Data Architect
    query: 'site:jobs.ashbyhq.com "Data Architect" OR "Principal Data Engineer" remote'
    enabled: true

  - name: Ashby — Senior Data Engineer
    query: 'site:jobs.ashbyhq.com "Senior Data Engineer" OR "Staff Data Engineer" OR "Lead Data Engineer" remote'
    enabled: true

  - name: Ashby — Data Platform
    query: 'site:jobs.ashbyhq.com "Data Platform" OR "Analytics Engineer" OR "Data Infrastructure" remote'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — Data Architect
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Data Architect" OR "Principal Data Engineer" remote'
    enabled: true

  - name: Greenhouse — Senior Data Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Senior Data Engineer" OR "Staff Data Engineer" remote'
    enabled: true

  - name: Greenhouse — Data Platform / Analytics Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Data Platform Engineer" OR "Analytics Engineer" OR "Data Infrastructure" remote'
    enabled: true

  # -- Lever --
  - name: Lever — Data Architect / Principal DE
    query: 'site:jobs.lever.co "Data Architect" OR "Principal Data Engineer" OR "Staff Data Engineer" remote'
    enabled: true

  # -- LinkedIn / Indeed / remote boards --
  - name: RemoteOK — Data roles
    query: 'site:remoteok.com "Data Architect" OR "Data Engineer" OR "Analytics Engineer" senior'
    enabled: true

  - name: WeWorkRemotely — Data Engineering
    query: 'site:weworkremotely.com "Data Architect" OR "Data Engineer" OR "Data Platform" senior'
    enabled: true

  - name: Himalayas — Remote Data Architect
    query: 'site:himalayas.app "Data Architect" OR "Principal Data Engineer" OR "Staff Data Engineer" remote'
    enabled: true

  - name: Himalayas — Remote Analytics Engineer
    query: 'site:himalayas.app "Analytics Engineer" OR "Data Platform" OR "Data Infrastructure" remote'
    enabled: true

  # -- Cloud platform data roles --
  - name: Databricks jobs
    query: '"Data Architect" OR "Principal Data Engineer" OR "Staff Data Engineer" site:databricks.com/company/careers remote'
    enabled: true

  - name: Snowflake jobs
    query: '"Data Architect" OR "Principal Data Engineer" OR "Analytics Engineer" site:careers.snowflake.com remote'
    enabled: true

  - name: dbt Labs jobs
    query: '"Data Engineer" OR "Analytics Engineer" OR "Architect" site:getdbt.com/careers OR site:jobs.lever.co/dbtlabs remote'
    enabled: true

  - name: Fivetran jobs
    query: '"Data Engineer" OR "Data Architect" OR "Solutions Engineer" site:fivetran.com/careers remote'
