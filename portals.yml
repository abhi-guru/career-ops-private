  # -- Enterprise / cloud vendor roles --
  - name: Microsoft Azure Data roles
    query: 'site:careers.microsoft.com "Data Architect" OR "Principal Data Engineer" OR "Staff Data Engineer" remote'
    enabled: true

  - name: AWS Data roles
    query: 'site:amazon.jobs "Data Architect" OR "Principal Data Engineer" OR "Data Platform" remote'
    enabled: true

  - name: Google Cloud Data roles
    query: 'site:careers.google.com "Data Architect" OR "Principal Data Engineer" OR "Analytics Engineer" remote'
    enabled: true

  # -- YC / startup boards --
  - name: YC Jobs — Data Architect / DE
    query: 'site:workatastartup.com "Data Architect" OR "Principal Data Engineer" OR "Staff Data Engineer" remote'
